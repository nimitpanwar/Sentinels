spring.application.name=spring-Sentinel

# ── Docker Compose (disabled — using local MySQL) ───────────────────────────
spring.docker.compose.enabled=false

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/sentinel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool shared by BOTH the synchronous write path and the async evaluation
# path - default (10) was a shared bottleneck; sized up with headroom for
# concurrent ingestion + up to the async pool's max concurrent evaluations
# (see AsyncConfig). Tune further based on actual MySQL max_connections/hardware.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# REQUIRED alongside hibernate.connection.provider_disables_autocommit below -
# that setting tells Hibernate "trust the pool, don't manage autocommit
# yourself", so the pool MUST actually disable it, or every commit/rollback
# fails with "Can't call commit when autocommit=true".
spring.datasource.hikari.auto-commit=false

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Standard HikariCP + Hibernate pairing: tells Hibernate the pool already
# manages autocommit state, skipping a redundant per-connection check.
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Batches same-type INSERT/UPDATE statements within a single transaction
# into fewer JDBC round trips. Does NOT change transaction boundaries,
# atomicity, or durability - purely reduces network round trips for writes
# that were already happening in the same commit.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Simulator ────────────────────────────────────────────────────────────────
simulator.enabled=false
simulator.interval-ms=3000
simulator.scenario-probability=0.1
simulator.log-file=transactions_log.txt
# temporary log file for simulator transactions. Will be deleted on application shutdown.

# ── Chatbot (rule/alert Q&A assistant) ───────────────────────────────────────
# Uses Groq's OpenAI-compatible chat completions API.
# API key is read from the GROQ_API_KEY environment variable - never hardcode it here.
# springdotenv.directory is set as an absolute path so the .env file is found
# regardless of how the app is launched (mvnw vs IDE "Run", which use different
# working directories).
springdotenv.directory=C:/JAVAWORKSPACE/Project/Safe/Sentinels/spring-Sentinel
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
# Absolute paths (working-directory-independent) - see springdotenv.directory note above
# for why relative paths are unreliable across launch methods. Comma-separated.
chatbot.knowledge-files=C:/JAVAWORKSPACE/Project/Safe/Sentinels/notes/RiskLogic.md,C:/JAVAWORKSPACE/Project/Safe/Sentinels/notes/Individual-Rules.md

# ── Network analysis "Run Analysis Now" (direct subprocess execution) ───────
# Absolute paths, same reasoning as chatbot.knowledge-files above (mvnw vs IDE
# "Run" use different working directories). Override with env vars if this
# repo is checked out somewhere else.
network.python.executable=${NETWORK_PYTHON_EXECUTABLE:C:/Users/Administrator/AppData/Local/Programs/Python/Python313/python.exe}
network.python.script-dir=${NETWORK_PYTHON_SCRIPT_DIR:C:/JavaWorkspace/Sentinels/network-analysis}
network.python.timeout-seconds=120

