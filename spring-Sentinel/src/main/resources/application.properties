spring.application.name=spring-Sentinel

# ── Docker Compose (disabled — using local MySQL) ───────────────────────────
spring.docker.compose.enabled=false

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/sentinel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=n3u3da!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Simulator ────────────────────────────────────────────────────────────────
simulator.enabled=true
simulator.interval-ms=3000
simulator.scenario-probability=0.1
simulator.log-file=transactions_log.txt
# temporary log file for simulator transactions. Will be deleted on application shutdown.
