<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentinel Rule Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 1.3rem; }
  #log { border: 1px solid #333; border-radius: 8px; padding: 12px; height: 420px; overflow-y: auto; background: #16181d; margin-bottom: 12px; }
  .msg { margin: 8px 0; white-space: pre-wrap; line-height: 1.4; }
  .msg.user { color: #7ec8ff; }
  .msg.bot { color: #b7f0ad; }
  .msg.error { color: #ff8080; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1c1f26; color: #eee; }
  button { padding: 10px 16px; border-radius: 6px; border: none; background: #3f7ae0; color: white; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  small { color: #888; }
</style>
</head>
<body>
  <h1>Sentinel Rule Assistant</h1>
  <small>Answers are grounded only in the rules database and risk-engine docs — no web search.</small>
  <div id="log"></div>
  <form id="chat-form">
    <input type="text" id="question" placeholder="e.g. What triggers a NEW_PAYEE alert?" autocomplete="off" required>
    <button type="submit" id="send-btn">Ask</button>
  </form>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage('You: ' + question, 'user');
    input.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chatbot/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      if (!res.ok) {
        addMessage('Error: ' + (data.answer || res.statusText), 'error');
      } else {
        addMessage('Assistant: ' + data.answer, 'bot');
      }
    } catch (err) {
      addMessage('Error: ' + err.message, 'error');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
