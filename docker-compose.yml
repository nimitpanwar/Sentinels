services:

  # ── MySQL database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sentinel_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Spring Boot backend ───────────────────────────────────────────────────
  backend:
    build: ./spring-Sentinel
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sentinel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      GROQ_API_KEY: ${GROQ_API_KEY}
      APP_INVESTIGATION_EMAIL_MODE: stub
      APP_INVESTIGATION_RESPONSE_PUBLIC_BASE_URL: http://localhost
    depends_on:
      db:
        condition: service_healthy

  # ── React frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build: ./sentinel-ui
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
