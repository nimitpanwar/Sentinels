server {
    listen 80;

    # Proxy all /api/* calls to the Spring Boot backend container.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy customer investigation response form routes to backend.
    location /investigation/ {
        proxy_pass         http://backend:8080/investigation/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Serve the React SPA — unknown paths fall back to index.html so
    # client-side routing (React Router) works correctly.
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
    }
}
